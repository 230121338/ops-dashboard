<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Ledger</span>
    </div>
    <nav class="nav">
      <a class="nav-item active" href="#">
        <span class="nav-dot"></span> Overview
      </a>
      <a class="nav-item" href="#" aria-disabled="true">
        <span class="nav-dot"></span> Orders
      </a>
      <a class="nav-item" href="#" aria-disabled="true">
        <span class="nav-dot"></span> Customers
      </a>
      <a class="nav-item" href="#" aria-disabled="true">
        <span class="nav-dot"></span> Products
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="status-pulse">
        <span class="pulse-dot" id="live-dot"></span>
        <span>Live from SQLite</span>
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div>
        <h1>Overview</h1>
        <p class="subtle">Orders, revenue, and product performance</p>
      </div>
      <div class="range-toggle" role="tablist" aria-label="Date range">
        <button class="range-btn" data-range="7d">7D</button>
        <button class="range-btn active" data-range="30d">30D</button>
        <button class="range-btn" data-range="90d">90D</button>
      </div>
    </header>

    <section class="kpi-row" id="kpi-row">
      <!-- KPI cards injected by app.js -->
    </section>

    <section class="grid-2">
      <div class="panel panel-chart">
        <div class="panel-head">
          <h2>Revenue</h2>
          <span class="subtle" id="revenue-range-label">Last 30 days</span>
        </div>
        <canvas id="revenue-chart" height="110"></canvas>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Top products</h2>
          <span class="subtle">By revenue</span>
        </div>
        <canvas id="products-chart" height="110"></canvas>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Recent orders</h2>
        <span class="subtle" id="orders-count-label"></span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Customer</th>
              <th>Product</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <!-- rows injected by app.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
